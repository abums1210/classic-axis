name: Build Classic Axis

on:
  push:
    branches: [ "master", "main", "rewrite" ]
    tags:
      - 'v*'
      - 'ver*'
      - '*.*.*'
      - '**'
  pull_request:
    branches: [ "master", "main", "rewrite" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Checkout Plugin-SDK
      uses: actions/checkout@v6
      with:
        repository: 'abums1210/plugin-sdk'
        path: 'plugin-sdk'
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Generate and Build Plugin-SDK Libraries
      shell: cmd
      run: |
        cd plugin-sdk
        set PLUGIN_SDK_DIR=%CD%
        
        echo ::group::Generate Plugin-SDK Solution
        call "tools\generate\Visual Studio.bat"
        echo ::groupEnd::
        
        set "SLN_FILE=plugin.sln"
        if exist "plugin.slnx" set "SLN_FILE=plugin.slnx"

        echo ::group::Build SDK GTA III static lib
        msbuild %SLN_FILE% /property:Configuration=Release /property:Platform="Mixed Platforms" /target:plugin_iii /m /verbosity:minimal
        echo ::groupEnd::
        
        echo ::group::Build SDK GTA VC static lib
        msbuild %SLN_FILE% /property:Configuration=Release /property:Platform="Mixed Platforms" /target:plugin_vc /m /verbosity:minimal
        echo ::groupEnd::

        echo ::group::Build SDK GTA SA static lib
        msbuild %SLN_FILE% /property:Configuration=Release /property:Platform="Mixed Platforms" /target:plugin_sa /m /verbosity:minimal
        echo ::groupEnd::

    - name: Set Environment Variables & Create Mock Folders
      shell: powershell
      run: |
        # Create mock script folders so the post-build copy commands don't crash
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\mock_gta3\scripts"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\mock_gtavc\scripts"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\mock_gtasa\scripts"
        
        # Inject paths into GITHUB_ENV for global MSBuild reference
        echo "PLUGIN_SDK_DIR=${{ github.workspace }}\plugin-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "GTA_III_DIR=${{ github.workspace }}\mock_gta3" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "GTA_VC_DIR=${{ github.workspace }}\mock_gtavc" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "GTA_SA_DIR=${{ github.workspace }}\mock_gtasa" | Out-File -FilePath $env:GITHUB_ENV -Append

    # Run root Premake to generate project files inside project_files/
    - name: Run Project Premake
      run: |
        .\premake5.exe vs2022

    - name: Build Classic Axis (Vice City)
      continue-on-error: true
      run: |
        msbuild project_files/classic-axis.sln /p:Configuration="ReleaseVC" /p:Platform="Win32" /m /verbosity:minimal

    - name: Build Classic Axis (GTA III)
      continue-on-error: true
      run: |
        msbuild project_files/classic-axis.sln /p:Configuration="ReleaseIII" /p:Platform="Win32" /m /verbosity:minimal

    - name: Checkout DirectImageRasterizer (Rewrite Branch)
      if: always() && (github.ref_name == 'rewrite' || github.ref == 'refs/heads/rewrite')
      uses: actions/checkout@v6
      with:
        repository: 'abums1210/DirectImageRasterizer'
        path: 'DirectImageRasterizer'

    - name: Build DirectImageRasterizer (Rewrite Branch)
      if: always() && (github.ref_name == 'rewrite' || github.ref == 'refs/heads/rewrite')
      continue-on-error: true
      run: |
        msbuild DirectImageRasterizer/DirectImageRasterizer.sln /p:Configuration="Release" /p:Platform="GTA-VC" /m /verbosity:minimal
        msbuild DirectImageRasterizer/DirectImageRasterizer.sln /p:Configuration="Release" /p:Platform="GTA3" /m /verbosity:minimal

    - name: Package Plugins into Individual Zips
      if: always()
      shell: powershell
      run: |
        $refName = '${{ github.ref_name }}'
        $ref = '${{ github.ref }}'
        $isRewrite = ($refName -eq 'rewrite' -or $ref -like '*/rewrite')

        New-Item -ItemType Directory -Force -Path "output/asi"

        if ($isRewrite) {
            $targets = @(
                @{
                    Name = "ClassicAxisVC"
                    AsiName = "ClassicAxisVC.asi"
                    IniName = "ClassicAxisVC.ini"
                    ScriptDir = "${{ github.workspace }}\mock_gtavc\scripts"
                    DirAsi = "DirectImageRasterizer.VC.asi"
                },
                @{
                    Name = "ClassicAxisIII"
                    AsiName = "ClassicAxisIII.asi"
                    IniName = "ClassicAxisIII.ini"
                    ScriptDir = "${{ github.workspace }}\mock_gta3\scripts"
                    DirAsi = "DirectImageRasterizer.III.asi"
                }
            )

            foreach ($target in $targets) {
                $baseName = $target.Name
                $asiSource = Join-Path $target.ScriptDir $target.AsiName
                if (-not (Test-Path $asiSource)) {
                    $asiSource = "output/asi/$($target.AsiName)"
                }
                if (-not (Test-Path $asiSource)) {
                    Write-Host "Skipping $baseName because $($target.AsiName) not found."
                    continue
                }

                $zipName = "output/asi/$baseName.zip"
                $stageDir = "output/stage/$baseName"
                if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }

                # 1. charlesvercetti_mods/ClassicAxis Remake/crosshairs and shaders
                $crosshairsDir = Join-Path $stageDir "charlesvercetti_mods/ClassicAxis Remake/crosshairs"
                $shadersDir = Join-Path $stageDir "charlesvercetti_mods/ClassicAxis Remake/shaders"
                New-Item -ItemType Directory -Force -Path $crosshairsDir | Out-Null
                New-Item -ItemType Directory -Force -Path $shadersDir | Out-Null

                if (Test-Path "resources/crosshairs") {
                    Copy-Item -Path "resources/crosshairs/*" -Destination $crosshairsDir -Recurse -Force
                }
                if (Test-Path "resources/shaders") {
                    Copy-Item -Path "resources/shaders/*" -Destination $shadersDir -Recurse -Force
                }

                # 2. scripts/ClassicAxis.asi, .ini, and DirectImageRasterizer.asi
                $scriptsDir = Join-Path $stageDir "scripts"
                New-Item -ItemType Directory -Force -Path $scriptsDir | Out-Null
                Copy-Item -Path $asiSource -Destination $scriptsDir -Force

                $iniSource = "resources/$($target.IniName)"
                if (Test-Path $iniSource) {
                    Copy-Item -Path $iniSource -Destination $scriptsDir -Force
                }

                $dirAsiSource = Join-Path $target.ScriptDir $target.DirAsi
                if (Test-Path $dirAsiSource) {
                    Copy-Item -Path $dirAsiSource -Destination $scriptsDir -Force
                } else {
                    Write-Warning "Could not find $($target.DirAsi) in $($target.ScriptDir)"
                }

                Write-Host "Archiving $baseName mod layout into $zipName..."
                Compress-Archive -Path "$stageDir/*" -DestinationPath $zipName -Force
            }
        } else {
            Get-ChildItem -Path "${{ github.workspace }}\mock_gta3\scripts", "${{ github.workspace }}\mock_gtavc\scripts", "${{ github.workspace }}\mock_gtasa\scripts" -Filter *.asi -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination "output/asi\" -Force
            }
            if (Test-Path "output/asi") {
                Get-ChildItem -Path "output/asi" -Filter *.asi | ForEach-Object {
                    $baseName = $_.BaseName
                    $zipName = "output/asi/$baseName.zip"
                    $stageDir = "output/stage/$baseName"
                    New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
                    Copy-Item -Path $_.FullName -Destination $stageDir -Force
                    $iniFile = "resources/$baseName.ini"
                    if (Test-Path $iniFile) {
                        Copy-Item -Path $iniFile -Destination $stageDir -Force
                    }
                    Write-Host "Archiving $($_.Name) and associated files into $zipName..."
                    Compress-Archive -Path "$stageDir/*" -DestinationPath $zipName -Force
                }
            }
        }

    - name: Prepare Release Metadata
      if: always()
      shell: powershell
      run: |
        $ref = '${{ github.ref }}'
        $refType = '${{ github.ref_type }}'
        $refName = '${{ github.ref_name }}'
        $projectName = "ClassicAxis"

        if ($refType -eq 'tag' -or $ref -like 'refs/tags/*') {
            $rawTag = if ($refName -and $refName -notlike 'refs/tags/*') { $refName } else { $ref -replace '^refs/tags/', '' }
            $verNo = $rawTag -replace '^(ver|v)', ''
            $tagId = if ($rawTag -match '^v\d') { $rawTag } else { "v$verNo" }
            $name = "$projectName v$verNo"
            $tagMsg = git tag -l --format='%(contents)' $rawTag
            if (-not $tagMsg) { $tagMsg = git log -1 --pretty=%B }
            $body = if ($tagMsg) { ($tagMsg | Out-String).Trim() } else { "Release $rawTag" }
            $artifactName = "${projectName}_v$verNo"
        } else {
            $now = Get-Date
            $ddmmyyyy_hhmmss = $now.ToString("ddMMyyyy_HHmmss")
            $dateFormatted = $now.ToString("dd/MM/yyyy") + " at " + $now.ToString("HH:mm:ss")
            $tagId = "build_$ddmmyyyy_hhmmss"
            $name = "$projectName Build $ddmmyyyy_hhmmss"
            $body = "Github Actions triggered build on $dateFormatted for branch $($refName)."
            $artifactName = "${projectName}_$ddmmyyyy_hhmmss"
        }
        "RELEASE_TAG=$tagId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RELEASE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RELEASE_BODY=$body" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Upload Finished ASI Plugins Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          output/asi/*.zip

    - name: Create GitHub Release
      if: always() && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref_name == 'rewrite')
      uses: ncipollo/release-action@v1
      with:
        artifacts: "output/asi/*.zip"
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_NAME }}
        body: ${{ env.RELEASE_BODY }}
        allowUpdates: true
        draft: false
        prerelease: false

