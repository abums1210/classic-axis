[ClassicAxis]
; Force auto aim while playing with keyboard and mouse.
ForceAutoAim = false
; Choose the lock on target to display while auto aiming (0 = default, 1 = SA, 2 = LCS/VCS).
LockOnTargetType = 1
; While aiming with mouse, displays a triangle with the color of the health over the head of the pedestrian.
ShowTriangleForMouseRecruit = true
; Makes the player walk using the defined keyboard key (NULL to disable).
WalkKey = LALT
; Makes camera while aiming similar to LCS/VCS.
StoriesAimingCoords = false
; Crosshair position from (0.0f - 1.0f) while aiming in third person (default 0.53f, 0.4f).
CameraCrosshairMultX = 0.53f
CameraCrosshairMultY = 0.4f
; Makes player arm angle (while pointing with one hand) similar to LCS/VCS.
StoriesPointingArm = false
; Adjust right analog stick sensitivity.
RightAnalogStickSensitivityX = 1.0f
RightAnalogStickSensitivityY = 1.0f
; Makes the player crouch using the defined keyboard key (NULL to disable).
CrouchKey = C
; Choose crosshair type (0 = default, 1 = dot only, 2 = dot with complex).
CrosshairType = 2
; Renders persistent crosshair dot on screen in 128 alpha (0 = off, 1 = on).
PersistentCrosshairDot = false
; Hit indicator on ped hit (0 = off, 1 = on while ped dead, 2 = always on).
HitIndicator = 2
; Dynamically animate complex crosshair radius based on weapon recoil and accuracy (0 = off, 1 = on).
AnimatedCrosshairs = true
; Screen desaturation and contrast flash effect on ped kill (GTA V / RDR2 style).
KillEffect = true
; Duration of the kill effect in milliseconds (default 400).
KillEffectDuration = 400
; Reload Settings WINDOWS KEYCODE (162 - LCtrl, 0 - disabled).
ReloadSettings = 162
; Enable third person over-the-shoulder aiming and firing for Rocket Launcher.
ThirdPersonRocketLauncher = true
; Pitch angle (in degrees) for rocket launcher alignment in 3rd-person aim (default -45.0f).
RocketAimPitch = -45.0f

